<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Magic</title>
    <link rel="icon" type="image/x-icon" href="images/128.ico">
    <link rel="stylesheet" href="css/lib/bootstrap.min.css"></link>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body class="bg-dark">
    <div class="d-flex justify-content-center">
        <div class="card col-11" id="divLoad">
            <image src="images/loading-load-icon-transparent.png" class="rounded mx-auto d-block img-fluid" alt="Loading"></image>
            <h1 class="text-center">Loading</h1>
        </div>
        <div class="col-11 justify-content-center col-lg-7 col-xxl-5 d-none" id="divHomeWeather">
            <div><button class="btn btn-primary col-12 mt-2" type="button" id="btnSetLocation" aria-label="Chose a location">Chose a location</button></div>
            <div class="mt-2" id="divDisplayWeather"></div>
        </div>
        <div class="col-11 d-none col-md-7 col-xl-5" id="divLocationSelect">
            <div class="card d-flex">
                <button class="btn text-start btn-secondary col-12 col-sm-2" type="button" id="btnHome" aria-label="Home" onclick="GoHome()">Home</button>
                <div class="card-body">
                    <h2 class="text-center text-primary my-2 col-12">Select a Location!</h2>
                    <form>
                        <label class="form-label mt-2" for="cboLocation">Location:</label>
                        <select class="form-control form-control-lg" id="cboLocation">
                            <option value="1" aria-label="Cookeville">Cookeville</option>
                            <option value="2" aria-label="Nashville">Nashville</option>
                            <option value="3" aria-label="Greenville">Greenville</option>
                        </select>
                            <button class="btn btn-primary col-8 mt-2" type="button" id="btnManualSetWeatherDropDown" aria-label="Select location">Select location</button>
                            <button class="btn btn-secondary col-4 mt-2" type="button" id="btnFindLocation" aria-label="Find my location"><i class="bi bi-crosshair"></i>Find my location</button>
                        <button class="btn btn-link col-6 mt-2 text-start" type="button" id="btnGetManualEntry" aria-label="Manual Entry">Manual Entry</button>
                    </form>
                </div>
            </div>
        </div>
        <div class="col-11 d-none col-md-7 col-xl-5" id="divLocationEnter">
            <div class="card d-flex">
                <button class="btn text-start btn-secondary col-12 col-sm-2" type="button" id="btnHome" aria-label="Home" onclick="GoHome()">Home</button>
                <div class="card-body">
                    <h2 class="text-center text-primary my-2 col-12">Choose a Location!</h2>
                    <form>
                        <label class="form-label mt-2" for="txtLatitude" aria-label="Latitude">Latitude:</label>
                        <input class="form-control" id="txtLatitude" placeholder="36.18">
                        <label class="form-label mt-2" for="txtLongitude" aria-label="Longitude">Longitude:</label>
                        <input class="form-control" id="txtLongitude" placeholder="-85.51">
                        <button class="btn btn-primary col-12 mt-2" type="button" id="btnManualSetWeatherCordinates" aria-label="Enter location">Enter location</button>
                        <p id="parWrongCoordinateEntery"></p>
                        <button class="btn btn-link col-6 mt-2 text-start" type="button" id="btnGetManualDropDown" aria-label="Select location">Select location</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    
    <script src="js/lib/bootstrap.bundle.min.js"></script>
    <script src="js/lib/chart.umd.min.js"></script>
    <script src="js/app.js"></script>

</body>
<footer>
    <div class="d-flex justify-content-center">
        <div class="col-11 justify-content-center col-lg-7 col-xxl-5">
            
                
                    <p class="text-info">The data shown here is produced thanks to the Open-Meteo API: <a href="https://open-meteo.com/en/docs" class="button">https://open-meteo.com/en/docs</button></p>
                
            
        </div>
    </div>
</footer>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Services</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://cdn.datatables.net/2.3.7/css/dataTables.dataTables.min.css" rel="stylesheet">
</head>
<body class="bg-dark">
    <div class="d-flex justify-content-center">
        <div id="divEmployees"  class="col-11 row justify-content-center"></div>
    </div>
    <div  class="d-flex justify-content-center">
        <div id="divTable" class="col-11 row justify-content-center">
            <div class="card">
                <div class="card-body">
                    <div style="width: 800px;"><canvas id="canSalaries"></canvas></div>

                    <table id="tblEmployees" class="table table-striped">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Department</th>
                                <th>Salary</th>
                            </tr>
                        </thead>
                        <tbody>

                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-4.0.0.min.js" integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="https://cdn.datatables.net/2.3.7/js/dataTables.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.0/chart.umd.min.js" integrity="sha512-Y51n9mtKTVBh3Jbx5pZSJNDDMyY+yGe77DGtBPzRlgsf/YLCh13kSZ3JmfHGzYFCmOndraf0sQgfM654b7dJ3w==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>    
<script >
        // We can perform CRUD activities on data
        // Create -> POST
        // Read -> GET
        // Update -> PUT, PATCH
        // Delete -> DELETE

        fetch('https://swollenhippo.com/salaries.php')
        .then(response => {
            if(!response.ok){
                throw new Error('Bad HTTP Response')
            }
            return response.json()
        })
        .then(data => {
            arrSalaries = data
            createChart(data)
            arrSalaries.forEach(objSalary => {
                document.querySelector('#tblEmployees tbody').innerHTML += `<tr><td>${objSalary.FirstName} ${objSalary.LastName}</td><td>${objSalary.Department}</td><td>${objSalary.Salary}</td></tr>`
            })
            let table = new DataTable('#tblEmployees');
            let arrEmployees = arrSalaries.filter(objEmployee => objEmployee.FirstName == 'Benjamin' | objEmployee.LastName == 'Burchfield')
            arrEmployees.forEach(objEmployee => {
                document.querySelector('#divEmployees').innerHTML += `<div class="card col-12 col-md-3 col-lg-2"><div class="card-body"><p class="fw-bold"><i class="bi bi-person-circle me-2 text-primary"></i>${objEmployee.FirstName} ${objEmployee.LastName}</p><p><i class="bi bi-building me-2 text-primary"></i>Department: ${objEmployee.Department}</p><p><i class="bi bi-piggy-bank me-2 text-primary"></i>Salary: ${objEmployee.Salary}</p></div></div>`
            })
        })
        .catch(error => console.error(error))

        function createChart(arrSalariesLocal){
            new Chart(
                document.getElementById('canSalaries'),
                {
                type: 'bar',
                options: {
                    backgroundColor: '#424242',
                    animation: false,
                    plugins: {
                        legend: {
                            display: false
                        },
                        tooltip: {
                            enabled: false
                        }
                    }
                },
                data: {
                    labels: arrSalariesLocal.map(objSalary => objSalary.FirstName + ' ' + objSalary.LastName),
                    datasets: [
                    {
                        label: 'Employee Salaries',
                        data: arrSalariesLocal.map(objSalary => objSalary.Salary.replace('$','').replace(',',''))
                    }
                    ]
                }
                }
            );
        }
        

    </script>
    
</body>
</html>
